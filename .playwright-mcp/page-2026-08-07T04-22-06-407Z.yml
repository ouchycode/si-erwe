              - generic [ref=f119e78]:
                - paragraph [ref=f119e79]: RW 04 Pabuaran, Kota Tangerang, dibentuk seiring dengan perkembangan pesat pemukiman di wilayah Kota Tangerang. Pada awalnya, wilayah ini hanya terdiri dari beberapa Rukun Tetangga yang terus berkembang hingga sekarang.
                - paragraph [ref=f119e80]: Seiring bertambahnya jumlah penduduk, RW 04 kini menaungi 8 RT. Warga RW 04 dikenal dengan semangat kegotongroyongannya yang tinggi, multikultural, dan aktif dalam berbagai kegiatan sosial kemasyarakatan.
