          - heading "Kebersihan Lingkungan" [level=1] [ref=f128e55]
          - paragraph [ref=f128e56]: Layanan kebersihan dan pengelolaan lingkungan RW 04 Pabuaran, Kota Tangerang
        - generic [ref=f128e57]:
          - generic [ref=f128e58]:
            - generic [ref=f128e59]:
              - img "Petugas Kebersihan" [ref=f128e60]
              - heading "Petugas Kebersihan" [level=2] [ref=f128e70]
            - generic [ref=f128e72]:
              - paragraph [ref=f128e73]: Kebersihan lingkungan RW 04 Pabuaran dijaga oleh tim kebersihan khusus yang berdedikasi tinggi. Petugas kebersihan bertugas setiap hari untuk mengumpulkan sampah dari rumah-rumah warga dan memastikan fasilitas umum serta jalanan tetap bersih dan nyaman untuk seluruh warga.
              - paragraph [ref=f128e74]: Pengangkutan sampah dilakukan menggunakan armada gerobak motor (bentor) yang beroperasi sesuai jadwal rutin harian. Selain pengangkutan sampah dari rumah ke rumah, petugas kebersihan juga membantu dalam pemeliharaan taman, penyapuan jalan raya utama, dan pembersihan saluran air (drainase) secara berkala untuk mencegah genangan air saat musim hujan.
          - generic [ref=f128e77]:
            - generic [ref=f128e78]:
              - heading "Sistem Pengelolaan Sampah" [level=2] [ref=f128e88]
              - generic [ref=f128e89]:
                - paragraph [ref=f128e90]: Pengelolaan sampah di RW 04 Pabuaran dilakukan dengan sistem yang terpadu dan berwawasan lingkungan. Warga diimbau untuk memisahkan sampah organik dan anorganik sebelum diangkut oleh petugas. Sampah anorganik bernilai ekonomis dapat disetorkan secara kolektif ke Bank Sampah yang dikelola oleh kader PKK dan Karang Taruna setempat.
                - paragraph [ref=f128e91]: Sistem pengelolaan ini didukung oleh iuran kebersihan warga yang dikelola secara transparan oleh pengurus RW. Dana tersebut dialokasikan sepenuhnya untuk kesejahteraan petugas kebersihan, perawatan armada angkut, serta pengadaan alat kebersihan lingkungan. Dengan sinergi yang baik antara warga dan petugas, RW 04 Pabuaran berkomitmen menciptakan lingkungan yang asri, bersih, hijau, dan bebas dari penyakit menular.
            - img "Sistem Pengelolaan Sampah" [ref=f128e93]
